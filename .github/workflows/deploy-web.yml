# Deploys the web app (web/) to Vercel production on every push to develop
# that changes the frontend.
#
# Why: the Vercel project is on the Hobby plan, which only deploys commits
# made by the project owner. This workflow deploys with the owner's token, so
# a merge by any team member is deployed.
#
# Needs the repository secret VERCEL_TOKEN (a Vercel access token).
# The org and project IDs are not secrets.
name: Deploy web to Vercel

on:
  push:
    branches: [develop]
    paths:
      - 'web/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_272iRN4lzFp7lGMpDCcPLWqH
      VERCEL_PROJECT_ID: prj_4BusIjUGldgaQgt1gVAlP43H5jYL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull the Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
